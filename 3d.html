<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>午夜廚房 3D</title><style>body{margin:0;background:#171a18;color:white;font:16px system-ui;overflow:hidden}canvas{display:block}#ui{position:absolute;top:10px;left:10px;right:10px;background:#14231cbb;padding:10px;border-radius:12px}button,select{padding:12px;border:0;border-radius:8px;margin:3px;font:inherit}#pad{position:absolute;bottom:15px;left:15px;width:130px;display:grid;grid-template-columns:repeat(3,42px);touch-action:none}#pad button{margin:1px;padding:13px}#act{position:absolute;bottom:20px;right:15px}#look{position:absolute;right:15px;bottom:90px}a{color:#d7ef88}small{display:block;font-size:12px}</style><div id="ui"><b>午夜廚房 3D · 原型</b> <a href="index.html">2D 備用</a><br><select id="role"><option value="roach">蟑螂</option><option value="human">人類</option></select><select id="type"><option value="fast">疾走型</option><option value="agile">靈巧型</option><option value="fly">飛行型</option></select><select id="mood"><option value="shy">人類：膽小</option><option value="chase">人類：追打</option><option value="spray">人類：噴藥</option></select><button id="reset">開始／重開</button><span id="status"></span><small>暫代程序模型，尚非寫實美術。蟑螂收集 3 份食物；人類靠近蟑螂按動作。WASD／方向鍵移動，左右轉鏡頭，Space 動作。</small></div><div id="pad"><i></i><button data-key="w">↑</button><i></i><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><div id="look"><button id="left">鏡頭 ◀</button><button id="right">▶</button></div><button id="act">動作／飛行</button><style>#pad{display:block;width:120px;height:120px;border:2px solid #c9de9b;border-radius:50%;background:#213c3299}#pad>*{display:none}#pad:after{content:"移動搖桿";position:absolute;top:48px;left:20px;pointer-events:none}#look{bottom:160px}#act{min-height:60px}</style><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color('#a7b3b0');scene.fog=new T.Fog('#a7b3b0',12,35);const cam=new T.PerspectiveCamera(65,innerWidth/innerHeight,.01,60),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x5e4a30,2));const sun=new T.DirectionalLight(0xffe5bd,3);sun.position.set(3,8,2);scene.add(sun);
function box(x,y,z,w,h,d,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,roughness:.65}));m.position.set(x,y,z);scene.add(m);return m}box(0,-.1,0,12,.2,10,'#99938b');for(let x=-6;x<=6;x++)box(x,.002,0,.015,.005,10,'#ccc9be');for(let z=-5;z<=5;z++)box(0,.002,z,12,.005,.015,'#ccc9be');box(0,1.6,-5,12,3.2,.1,'#d9d5c8');box(-6,1.6,0,.1,3.2,10,'#d9d5c8');box(6,1.6,0,.1,3.2,10,'#d9d5c8');const obstacles=[{x:-3,z:-3,w:4,d:1.4},{x:3,z:-3,w:2,d:1.4},{x:0,z:0,w:2,d:1.4}];obstacles.forEach(o=>{box(o.x,.55,o.z,o.w,1.1,o.d,'#596b62');box(o.x,1.14,o.z,o.w+.1,.08,o.d+.1,'#e2dccd')});for(const x of [-.8,.8])for(const z of [1.8,2.8])box(x,.45,z,.08,.9,.08,'#5c4332');box(0,.95,2.3,2,.1,1.4,'#8b6545');
function ell(group,x,y,z,a,b,c,color){const m=new T.Mesh(new T.SphereGeometry(1,12,8),new T.MeshStandardMaterial({color}));m.scale.set(a,b,c);m.position.set(x,y,z);group.add(m);return m}
const roach=new T.Group();ell(roach,0,.07,0,.09,.055,.17,'#603420');ell(roach,0,.09,-.14,.07,.05,.07,'#432515');for(const side of [-1,1])for(let j=0;j<3;j++){const leg=new T.Mesh(new T.CylinderGeometry(.008,.008,.19,5),new T.MeshStandardMaterial({color:'#704e2f'}));leg.rotation.z=side*1.2;leg.position.set(side*.12,.04,(j-1)*.11);roach.add(leg)}for(const side of [-1,1]){const points=[new T.Vector3(side*.03,.1,-.18),new T.Vector3(side*.13,.12,-.4)];roach.add(new T.Line(new T.BufferGeometry().setFromPoints(points),new T.LineBasicMaterial({color:'#302217'})))}scene.add(roach);
const human=new T.Group();ell(human,0,1.65,0,.15,.19,.15,'#bf987b');ell(human,0,1.1,0,.24,.4,.15,'#698ba2');for(const side of [-1,1]){ell(human,side*.13,.44,0,.09,.44,.1,'#313c48');ell(human,side*.31,1.08,0,.07,.35,.07,'#bf987b')}scene.add(human);
let axis={x:0,z:0},pointer=null;let keys=new Set(),yaw=0,p,score,end,cool=0,flight=0,hp=100,foods=[];const $=s=>document.querySelector(s),dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);function reset(){keys.clear();p={x:-4,z:3};human.position.set(3,0,2);roach.position.set(-4,0,3);for(const f of foods)scene.remove(f);foods=[[-4,-1],[4,-1],[3,3]].map(([x,z])=>{const f=box(x,.045,z,.12,.08,.12,'#f0cb65');return f});score=0;end=false;hp=100;cool=0;flight=0;yaw=0}reset();function move(o,dx,dz){const valid=(x,z)=>Math.abs(x)<5.7&&Math.abs(z)<4.7&&!obstacles.some(b=>Math.abs(x-b.x)<b.w/2+.12&&Math.abs(z-b.z)<b.d/2+.12);if(valid(o.x+dx,o.z))o.x+=dx;if(valid(o.x,o.z+dz))o.z+=dz}
function act(){if(end)return;if($('#role').value==='roach'){if($('#type').value==='fly'&&cool<=0){flight=5;cool=8}}else if(dist(human.position,roach.position)<1.3&&cool<=0){score++;cool=1;roach.position.set(Math.random()*8-4,0,3.5);if(score>=3)end=true}}$('#act').onclick=()=>{if($('#role').value==='roach'&&$('#type').value!=='fly'){document.querySelector('#status').textContent=' 此型態不能飛行，請選擇飛行型';return}act()};$('#reset').onclick=reset;$('#role').onchange=reset;$('#type').onchange=reset;$('#mood').onchange=reset;$('#left').onclick=()=>yaw+=.3;$('#right').onclick=()=>yaw-=.3;for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(b.dataset.key))}addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space'){e.preventDefault();if(!e.repeat)act()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>keys.clear());addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const pad=$('#pad');function steer(e){const r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/45,z=(e.clientY-r.top-r.height/2)/45,l=Math.max(1,Math.hypot(x,z));axis={x:x/l,z:z/l}}pad.onpointerdown=e=>{if(pointer!==null)return;pointer=e.pointerId;pad.setPointerCapture(pointer);steer(e)};pad.onpointermove=e=>{if(e.pointerId===pointer)steer(e)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===pointer){pointer=null;axis={x:0,z:0}}});addEventListener('blur',()=>{axis={x:0,z:0};pointer=null});let last=performance.now();function loop(t){requestAnimationFrame(loop);const dt=Math.min(.04,(t-last)/1000);last=t;const isR=$('#role').value==='roach',target=isR?roach:human;if(!end){cool=Math.max(0,cool-dt);flight=Math.max(0,flight-dt);let x=axis.x+(keys.has('d')?1:0)-(keys.has('a')?1:0),z=axis.z+(keys.has('s')?1:0)-(keys.has('w')?1:0),l=Math.max(1,Math.hypot(x,z));const speed=isR?($('#type').value==='fast'?1.5:$('#type').value==='fly'?.85:1.2):1.7;move(target.position,(x*Math.cos(yaw)+z*Math.sin(yaw))/l*speed*dt,(-x*Math.sin(yaw)+z*Math.cos(yaw))/l*speed*dt);if(x||z){const desired=Math.atan2(x,z)+yaw;target.rotation.y+=Math.atan2(Math.sin(desired-target.rotation.y),Math.cos(desired-target.rotation.y))*Math.min(1,dt*12)}roach.position.y=T.MathUtils.damp(roach.position.y,flight>0?1.2:0,5,dt);
if(isR){for(const f of [...foods])if(dist(roach.position,f.position)<.3){scene.remove(f);foods=foods.filter(v=>v!==f);score++;if(score===3)end=true}const d=dist(human.position,roach.position);if(d<3){const sign=$('#mood').value==='shy'?-1:1;move(human.position,(roach.position.x-human.position.x)/(d||1)*dt*.6*sign,(roach.position.z-human.position.z)/(d||1)*dt*.6*sign);if(sign>0&&d<.6&&cool<=0&&!(flight>0&&$('#mood').value==='chase')){hp-=20;cool=1;if(hp<=0)end=true}}}else{const d=dist(roach.position,human.position);if(d<2)move(roach.position,(roach.position.x-human.position.x)/(d||1)*dt*.9,(roach.position.z-human.position.z)/(d||1)*dt*.9)}}
const height=isR?1.1:1.9,back=isR?2.4:3;cam.position.set(target.position.x+Math.sin(yaw)*back,target.position.y+height,target.position.z+Math.cos(yaw)*back);cam.lookAt(target.position.x,target.position.y+(isR?.25:1.2),target.position.z);$('#status').textContent=end?(hp<=0?' 挑戰失敗，請重開':' 任務完成！請重開'):` ${isR?'食物':'處理蟑螂'} ${score}/3 · HP ${hp} · ${flight>0?'飛行中 '+flight.toFixed(1)+'s':cool>0?'冷卻 '+cool.toFixed(1)+'s':$('#type').value==='fly'?'飛行就緒':'地面型（不能飛）'}`;renderer.render(scene,cam)}requestAnimationFrame(loop);
</script></html>
