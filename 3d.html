<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>午夜廚房 3D</title><style>body{margin:0;background:#171a18;color:white;font:16px system-ui;overflow:hidden}canvas{display:block}#ui{position:absolute;top:10px;left:10px;right:10px;background:#14231cbb;padding:10px;border-radius:12px}button,select{padding:12px;border:0;border-radius:8px;margin:3px;font:inherit}#pad{position:absolute;bottom:15px;left:15px;width:130px;display:grid;grid-template-columns:repeat(3,42px);touch-action:none}#pad button{margin:1px;padding:13px}#act{position:absolute;bottom:20px;right:15px}#look{position:absolute;right:15px;bottom:90px}a{color:#d7ef88}small{display:block;font-size:12px}</style><div id="ui"><b>午夜廚房 3D · 原型</b> <a href="index.html">2D 備用</a><br><select id="role"><option value="roach">蟑螂</option><option value="human">人類</option></select><select id="type"><option value="fast">疾走型</option><option value="agile">靈巧型</option><option value="fly">飛行型</option></select><select id="mood"><option value="shy">人類：膽小</option><option value="chase">人類：追打</option><option value="spray">人類：噴藥</option></select><button id="reset">開始／重開</button><button id="pause">暫停</button><span id="status"></span><div id="threat" role="status" aria-live="polite"></div><div id="feedback" role="status" aria-live="polite" style="color:#f4dd9a;min-height:1.5em"></div><small>暫代程序模型，尚非寫實美術。蟑螂收集 3 份食物，再把橘色大食物帶回綠色交付點；人類靠近蟑螂按動作。WASD／方向鍵移動，左右轉鏡頭，在遊戲畫面拖曳可環視／俯仰，左下搖桿移動。E／驚嚇鍵：靠近膽小人類，首次 +20 XP；每份食物 +10 XP，30 XP 升級增加移速及力量。F／搬運鍵：需力量 2，搬運時減速 20%，再按可放下或交付。追打型出現橘色落點後 0.6 秒揮擊，離開範圍可閃避。Space 動作；飛行型起飛後可升高／降低，再按動作降落。</small></div><div id="pad"><i></i><button data-key="w">↑</button><i></i><button data-key="a">←</button><button data-key="s">↓</button><button data-key="d">→</button></div><div id="look"><button id="left">鏡頭 ◀</button><button id="right">▶</button></div><button id="carry" style="position:absolute;bottom:90px;right:220px;min-height:60px">搬運／交付</button><button id="scare" style="position:absolute;bottom:20px;right:220px;min-height:60px">驚嚇</button><button id="act">動作／起飛／降落</button><div id="altitude" style="position:absolute;right:15px;bottom:90px"><button id="rise">升高 ＋</button><button id="lower">降低 −</button></div><style>#pad{display:block;width:120px;height:120px;border:2px solid #c9de9b;border-radius:50%;background:#213c3299}#pad>*{display:none}#pad:after{content:"移動搖桿";position:absolute;top:48px;left:20px;pointer-events:none}#look{bottom:160px}#act{min-height:60px}</style><script type="module">

const roach=new T.Group();ell(roach,0,.07,0,.09,.055,.17,'#603420');ell(roach,0,.09,-.14,.07,.05,.07,'#432515');for(const side of [-1,1])for(let j=0;j<3;j++){const leg=new T.Mesh(new T.CylinderGeometry(.008,.008,.19,5),new T.MeshStandardMaterial({color:'#704e2f'}));leg.rotation.z=side*1.2;leg.position.set(side*.12,.04,(j-1)*.11);roach.add(leg)}for(const side of [-1,1]){const points=[new T.Vector3(side*.03,.1,-.18),new T.Vector3(side*.13,.12,-.4)];roach.add(new T.Line(new T.BufferGeometry().setFromPoints(points),new T.LineBasicMaterial({color:'#302217'})))}scene.add(roach);

let lookPointer=null,lookX=0,lookY=0,pitch=.4;let progress=createProgress();let paused=false;let altitude=.8;let axis={x:0,z:0},pointer=null;let keys=new Set(),yaw=0,p,score,end,cool=0,damageCooldown=0,flight=0,hp=100,foods=[];const $=s=>document.querySelector(s),dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);function clearMovement(){lookPointer=null;keys.clear();axis={x:0,z:0};pointer=null}
function reset(){chaseAttack=createChaseAttack();attackMarker.visible=false;$('#threat').textContent='';if(largeFood)scene.remove(largeFood);largeFood=box(4,.08,2,.2,.16,.2,'#ee8b3e');largeFood.scale.set(1.5,1,1.5);carrying=false;largeDelivered=false;progress=createProgress();paused=false;$('#pause').textContent='暫停';clearMovement();$('#feedback').textContent='選擇角色後開始探索。';altitude=.8;p={x:-4,z:3};human.position.set(3,0,2);roach.position.set(-4,0,3);for(const f of foods)scene.remove(f);foods=[[-4,-1],[4,-1],[3,3]].map(([x,z])=>{const f=box(x,.045,z,.12,.08,.12,'#f0cb65');return f});score=0;end=false;hp=100;cool=0;damageCooldown=0;flight=0;yaw=0;pitch=.4}reset();function move(o,dx,dz){const valid=(x,z)=>Math.abs(x)<5.7&&Math.abs(z)<4.7&&!obstacles.some(b=>Math.abs(x-b.x)<b.w/2+.12&&Math.abs(z-b.z)<b.d/2+.12);if(valid(o.x+dx,o.z))o.x+=dx;if(valid(o.x,o.z+dz))o.z+=dz}
function actionFeedback(text){$('#feedback').textContent=text}
function carryFood(){
 if(paused||end||$('#role').value!=='roach')return;
 if(largeDelivered){actionFeedback('大型食物已交付。');return}
 if(carrying){
  carrying=false;
  if(withinReach(roach.position,{x:-4,y:0,z:3},.6)){
   largeDelivered=true;scene.remove(largeFood);awardExperience(progress,'large:delivery',30);
   if(score===3)end=true;
   actionFeedback('大型食物已交付！經驗 +30。');

$('#carry').onclick=carryFood;
function scare(){
 if(paused||end||$('#role').value!=='roach')return;
 if($('#mood').value!=='shy'){actionFeedback('這位人類不怕蟑螂，請小心！');return}
 if(!withinReach(roach.position,human.position,1.3)){actionFeedback('請靠近膽小人類再驚嚇。');return}
 if(!awardExperience(progress,'scare:first',20)){actionFeedback('本局驚嚇獎勵已領取。');return}
 actionFeedback('驚嚇成功！經驗 +20。');
}
$('#scare').onclick=scare;
function act(){
 if(paused){actionFeedback('目前已暫停，請按繼續。');return}
 if(end){actionFeedback('本局已結束，請按開始／重開。');return}
 if($('#role').value==='roach'){
  if(carrying){actionFeedback('搬運時無法起飛，請先放下或交付。');return}
  if($('#type').value!=='fly'){actionFeedback('此型態不能飛行，請選擇飛行型。');return}
  if(flight>0){flight=0;actionFeedback('正在降落。');return}
  if(cool>0){actionFeedback('飛行尚在冷卻，請等 '+Math.ceil(cool)+' 秒。');return}

 }else{
  if(cool>0){actionFeedback('動作尚在冷卻，請稍候。');return}

}
function setPaused(value){paused=value;clearMovement();$('#pause').textContent=paused?'繼續':'暫停';actionFeedback(paused?'已暫停，按繼續返回遊戲。':'繼續探索。')}
$('#pause').onclick=()=>setPaused(!paused);document.addEventListener('visibilitychange',()=>{if(document.hidden)setPaused(true)});addEventListener('blur',()=>setPaused(true));
$('#act').onclick=act;$('#rise').onclick=()=>{if(!paused&&flight>0)altitude=adjustAltitude(altitude,.25)};$('#lower').onclick=()=>{if(!paused&&flight>0)altitude=adjustAltitude(altitude,-.25)};$('#reset').onclick=reset;$('#role').onchange=reset;$('#type').onchange=reset;$('#mood').onchange=reset;$('#left').onclick=()=>{if(!paused)yaw+=.3};$('#right').onclick=()=>{if(!paused)yaw-=.3};for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{if(paused)return;e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(b.dataset.key))}addEventListener('keydown',e=>{if(paused)return;keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault();if(e.code==='KeyF'&&!e.repeat)carryFood();if(e.code==='KeyE'&&!e.repeat)scare();if(e.code==='Space'){e.preventDefault();if(!e.repeat)act()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',clearMovement);addEventListener('resize',()=>{clearMovement();cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

if(d<3&&!(mood==='chase'&&chaseAttack.phase==='windup')){
